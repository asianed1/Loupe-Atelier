name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK 35 & Accept Licenses
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          mkdir -p "$SDK_ROOT/licenses"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Optimized Release APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Sign Release APK with Anonymous Community Keystore
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          ZIPALIGN="$SDK_ROOT/build-tools/35.0.0/zipalign"
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"
          FINAL_APK="android/app/build/outputs/apk/release/LoupeAtelier-release.apk"

          keytool -genkeypair -v \
            -keystore /tmp/loupe-release.jks \
            -storepass loupe-standalone-key \
            -keypass loupe-standalone-key \
            -alias loupe-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Loupe Atelier, O=Standalone Edge, C=US"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks /tmp/loupe-release.jks \
            --ks-key-alias loupe-release \
            --ks-pass pass:loupe-standalone-key \
            --key-pass pass:loupe-standalone-key \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"
          "$APKSIGNER" verify --verbose "$FINAL_APK"

      - name: Upload Single Install-Ready Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LoupeAtelier-release-apk
          path: android/app/build/outputs/apk/release/LoupeAtelier-release.apk
          if-no-files-found: error
